# Reference deployment stack; use TLS reverse proxy, managed secrets, backups and non-owner DB roles.
# DO NOT claim production readiness before final acceptance and real provider onboarding.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elhafez
      POSTGRES_USER: elhafez_migration
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Provide a strong PostgreSQL admin password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elhafez_migration -d elhafez"]
      interval: 8s
      timeout: 4s
      retries: 10
    networks: [internal]
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", ".build/apps/api/src/server.js"]
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Use a non-owner RLS-enforced PostgreSQL role}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?Use a separate restricted platform admin connection}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      META_APP_SECRET: ${META_APP_SECRET:?Meta app secret required}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?Webhook verify token required}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:?32 bytes encoded in base64 required}
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 7s
      retries: 4
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", ".build/apps/worker/main.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Use a non-owner RLS-enforced PostgreSQL role}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:?32 bytes encoded in base64 required}
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/web/server.mjs"]
    environment:
      WEB_PORT: 3000
      API_INTERNAL_ORIGIN: http://api:4000
    ports:
      - "127.0.0.1:3000:3000" # TLS reverse proxy must terminate HTTPS on public domain.
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
volumes:
  pgdata:
networks:
  internal:
    driver: bridge