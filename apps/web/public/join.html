<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تفعيل الحساب — Elhafez Boat</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/operations.css"></head><body style="background:#f3f7fb"><header style="background:#102f4b;color:white;padding:23px 5%"><strong>✦ Elhafez Boat — تفعيل دعوة الحساب</strong></header><main style="max-width:500px;margin:8vh auto;padding:0 18px"><div class="ops-panel"><h2>تفعيل دعوة الموظف أو المالك</h2><p>افتح الرابط اللي وصلك من مدير الشركة، وسجل بالبريد المدعو. لو ليك حساب سابق، استخدم كلمة المرور الحالية.</p><div id="join-notice" role="status" class="ops-note" hidden></div><form class="ops-form" id="join-form"><label>البريد الإلكتروني المدعو<input type="email" name="email" autocomplete="email" required></label><label>كلمة المرور (12 حرف على الأقل)<input type="password" name="password" minlength="12" autocomplete="new-password" maxlength="256" required></label><button class="primary" type="submit">قبول الدعوة</button></form><p class="ops-security">الرابط صالح لمدة محددة ولمرة واحدة. لا تشاركه مع أي شخص غير صاحب البريد المدعو.</p><a id="join-login" href="/">العودة لتسجيل الدخول</a></div></main><script type="module" src="/join.js"></script></body></html>
