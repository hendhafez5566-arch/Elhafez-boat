name: Verify
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elhafez_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elhafez_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elhafez_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run db:migrate
      - run: CI_DB_INTEGRATION=1 node tests/db-integration.mjs

  acceptance-runtime:
    name: Disposable PostgreSQL and headless browser acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elhafez_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elhafez_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elhafez_ci
      CI_RUNTIME_ACCEPTANCE: '1'
      CI_ACCEPTANCE_DISPOSABLE_DB: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build app and worker
        run: npm run build
      - name: Apply all PostgreSQL migrations
        run: npm run db:migrate
      - name: Check headless Chrome availability
        shell: bash
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Real non-owner runtime / web browser acceptance
        run: node tests/runtime-acceptance.mjs
      - name: Upload non-sensitive browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elhafez-browser-acceptance
          path: acceptance-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
